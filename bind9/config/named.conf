acl "trusted" {
    localhost;
    192.168.20.0/24;
    172.16.0.0/12;   // Default docker network range
    192.168.1.0/24;
};

options {
	directory "/var/cache/bind/";

	listen-on-v6 { any; };
	listen-on port 53 { any; };

	allow-query { trusted; };
	allow-query-cache { trusted; };

    recursion yes;
    allow-recursion { trusted; };

    dnssec-validation no;

	# settings up outside dns servers
	forwarders {
		8.8.8.8;
		8.8.4.4;
	};
}; 

zone "homelab.lan" {
  type master;
  file "/etc/bind/zones/db.homelab.lan";  
};

zone "20.168.192.in-addr.arpa" {
  type master;
  file "/etc/bind/zones/db.192";  
};

