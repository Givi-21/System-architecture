services: 
  proxy:
    image: traefik:latest
    container_name: traefik_proxy_server
    command: 
      --log.level=DEBUG
      --api.insecure=true
      --providers.docker=true
      --providers.docker.exposedbydefault=false
      --entrypoints.web.address=:80
      --providers.docker.network=front_net
    
    ports:
      - "80:80"
      - "8080:8080"
     
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - front_net

    depends_on:
      - web
 
    restart: unless-stopped

  web: 
    image: nginx:alpine
    container_name: web_server
    networks:
      - front_net

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.routers.web.rule=Host(`homelab.192.168.1.11.sslip.io`) || Host(`localhost`)"
      - "traefik.http.services.web.loadbalancer.server.port=80"
      - "traefik.docker.network=front_net"

    volumes:
      # RO specifies the rule of readonly, so it doesn't modify in host machine
      - ./web_conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web_conf/index.html:/usr/share/nginx/html/index.html:ro
      - ./web_conf/default.conf:/etc/nginx/conf.d/default.conf:ro

    restart: unless-stopped

networks:
  front_net:
    external: true
