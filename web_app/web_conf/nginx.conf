events {
	# Number of simultenious connections
	worker_connections 1024;
}

http {
	# web server's configuration
	include "/etc/nginx/conf.d/default.conf";

	ssl_protocols TLSv1.2 TLSv1.3;

	# TLS session tickets are use to send a "ticket" to users browser(which only web server can decrypt) so that web server doesnt have to hold every users "state".

	ssl_session_tickets on;

	# Set the Vary http header, as defined in RFC 2616
	gzip_vary on;

	# Path for buffered log write.
	access_log /var/log/nginx/access.log;
}
